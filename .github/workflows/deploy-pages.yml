name: Deploy website to GitHub Pages

# Publishes the static download site under website/ to GitHub Pages.
# Runs on any push to main that touches the site (or this workflow), and can be
# triggered manually. The page reads the latest release through the GitHub API,
# so shipping a new version never needs a redeploy - only content or layout
# changes require a run.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress run finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        # Pages has to be switched on once in the repo UI first
        # (Settings -> Pages -> Source: GitHub Actions). GITHUB_TOKEN may not create
        # the Pages site itself, so `enablement: true` fails with
        # "Resource not accessible by integration".
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
