name: Deploy website to GitHub Pages

# Publishes the download site (website/) at the Pages root and the Compose Wasm
# app at /live. A push that only touches the static page still rebuilds the Wasm
# bundle: Pages deploys one artifact, so the live app has to travel with it.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "webApp/**"
      - "shared/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress run finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      # Same JDK as the web CI job: Metro refuses to load below 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      # Webpack and ComposePWA's workbox step need Node.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build Wasm PWA
        run: ./gradlew :webApp:wasmJsBrowserDistribution --no-daemon --stacktrace

      - name: Assemble Pages site
        run: |
          mkdir -p _site/live
          cp -a website/. _site/
          cp -a webApp/build/dist/wasmJs/productionExecutable/. _site/live/
          # Jekyll would skip webpack chunks whose names start with _; we are not a Jekyll site.
          touch _site/.nojekyll
          touch _site/live/.nojekyll
          if [ ! -f _site/live/index.html ]; then
            echo '::error::Wasm distribution produced no index.html'
            exit 1
          fi

      - name: Configure Pages
        # Pages has to be switched on once in the repo UI first
        # (Settings -> Pages -> Source: GitHub Actions). GITHUB_TOKEN may not create
        # the Pages site itself, so `enablement: true` fails with
        # "Resource not accessible by integration".
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
